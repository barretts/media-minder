name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0-beta.1)'
        required: true
        default: 'v1.0.0-beta.1'

jobs:
  release:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install JS dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        with:
          tagName: ${{ github.event.inputs.tag }}
          releaseName: MediaMinder ${{ github.event.inputs.tag }}
          releaseBody: |
            ## MediaMinder ${{ github.event.inputs.tag }}

            First public beta release of MediaMinder — a Tauri-based desktop movie library manager.

            ### Features
            - Scan local folders for video files
            - Fetch metadata, cast, ratings, and artwork from TMDB
            - Save Kodi-compatible NFO files alongside each movie
            - Download poster, fanart, and actor thumbnails
            - Manual search and match for any movie
            - Auto-match all unmatched movies in one click
            - Detect and manage duplicate entries
            - Solaris dark theme UI built with React + Tailwind CSS

            ### Setup
            1. Download the installer for your platform below
            2. Open **Settings** and enter your [TMDB API key](https://www.themoviedb.org/settings/api) (free)
            3. Add your movie directories and click **Scan Folders**

            ### Notes
            - This is a beta release — please [report issues](https://github.com/${{ github.repository }}/issues)
            - macOS build targets Apple Silicon (M-series); Intel Macs are not yet tested
            - Settings are stored in `~/.mediaminder/settings.json`
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
